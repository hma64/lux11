<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LUX vêtements — Mode homme</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body id="catalogPage">
  <header class="navbar" style="display:none">
    <!-- legacy navbar hidden; replaced by injectNav() -->
  </header>

  <main id="home">
    <!-- HERO SECTION -->
    <section class="hero-section" id="heroSection">
      <img src="assets/hero1.webp" alt="Collection Tendance" loading="eager" class="hero-image" />
      <div class="hero-overlay">
        <div class="hero-content">
          <div class="container hero-text-wrapper">
            <h2 class="hero-title">Nouvelle<br><span>Collection</span><br>Printemps 2025</h2>
            <p class="hero-description">Découvrez les dernières tendances de la maison.</p>
            <a class="btn btn-primary" href="produits.html">Voir la collection</a>
          </div>
        </div>
      </div>
    </section>

    <section id="shop">
      <div class="container">
        <div class="products-grid" id="productsContainer"></div>
        <div class="state-box" id="stateBox" style="display: none"></div>
      </div>
    </section>

  </main>

  <div class="dim" id="cartDim"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <button class="cart-btn" id="closeCartBtn" type="button" style="align-self: flex-end; margin: 8px">✕</button>
    <div class="cart-head">
      <strong id="cartHeadLabel">Panier</strong>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div style="display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 10px">
        <span id="cartTotalLabel">Total</span>
        <span id="cartTotal">0 DT</span>
      </div>
      <button class="btn btn-primary" id="checkoutBtn" type="button" style="width: 100%">Valider mes achats</button>
    </div>
  </aside>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-brand">
        <a class="footer-logo" href="index.html">LUX vêtements</a>
        <p>Maison de mode homme premium, élégante et moderne.</p>
      </div>
      <div class="footer-links">
        <h3>Liens utiles</h3>
        <a href="index.html">Accueil</a>
        <a href="produits.html">Boutique</a>
        <a href="produits.html">Nouveautés</a>
      </div>
      <div class="footer-contact">
        <h3>Restez connectés</h3>
        <div class="footer-social">
          <a class="footer-social-link" href="https://instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2Zm0 1.5A4[...]
            </svg>
          </a>
          <a class="footer-social-link" href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 3H9.75A4.75 4.75 0 0 0 5 7.75V11.5H2.5v4H5V22h4.5v-6.5h3.25l.5-4H9.5V8.25c0-.69.56-1.25 1.25-1.25h2.25V3Z"/></svg>Facebook
          </a>
          <a class="footer-social-link" href="https://wa.me/21698137767" target="_blank" rel="noopener" aria-label="WhatsApp">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.[...]
            </svg>
          </a>
          <a class="footer-social-link" href="https://m.me/" target="_blank" rel="noopener" aria-label="Messenger">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 5.92 2 10.5c0 2.76 1.4 5.21 3.6 6.75L5 22l4.05-2.2c.95.24 1.95.36 3 .36 5.52 0 10-3.92 10-8.5S17.52 2 12 2Zm1.44 11[...]
            </svg>
          </a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <span id="footerNote">LUX vêtements</span> — © <span id="year"></span> · Tous droits réservés
      <a class="footer-admin-btn" href="admin.html" aria-label="Admin dashboard">Admin</a>
    </div>
  </footer>

  <script type="module" src="js/index-page.js"></script>
  <script type="module">
    import { injectNav } from './js/nav.js';
    injectNav({ page: 'home' });
  </script>
  <script type="module" src="js/admin-trigger.js"></script>
</body>
</html>
